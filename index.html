<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover delicious meals and artisanal cocktails with our production-grade Random Recipe & Cocktail Generator. Zero build step, instant loading, offline ready.">
  <meta name="theme-color" content="#6366f1">
  <title>Feast & Sip — Random Recipe & Cocktail Generator</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Application Header -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <div>
          <span class="text-lg font-extrabold text-slate-900 dark:text-white tracking-tight">Feast & Sip</span>
          <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">
            Generator
          </span>
        </div>
      </div>

      <!-- Theme Controls -->
      <div id="theme-selector" class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200/60 dark:border-slate-700/60" role="radiogroup" aria-label="Theme selection">
        <button 
          data-theme-choice="light" 
          role="radio" 
          aria-checked="false"
          aria-label="Light theme" 
          title="Light theme"
          class="p-1.5 rounded-lg text-xs font-medium transition-all focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>

        <button 
          data-theme-choice="dark" 
          role="radio" 
          aria-checked="false"
          aria-label="Dark theme" 
          title="Dark theme"
          class="p-1.5 rounded-lg text-xs font-medium transition-all focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>

        <button 
          data-theme-choice="system" 
          role="radio" 
          aria-checked="true"
          aria-label="System theme" 
          title="System theme"
          class="p-1.5 rounded-lg text-xs font-medium transition-all focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Hero & Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Controls Header Card -->
    <div class="no-print bg-white dark:bg-slate-800/90 rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 dark:border-slate-700/60 mb-8 backdrop-blur-md">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        
        <!-- Segmented Tab Toggle -->
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-400 dark:text-slate-500 mb-2">
            Select Recipe Category
          </label>
          <div id="source-toggle" role="tablist" class="inline-flex p-1.5 bg-slate-100 dark:bg-slate-900 rounded-xl border border-slate-200/60 dark:border-slate-800">
            <button 
              id="tab-meal" 
              role="tab" 
              aria-selected="true" 
              aria-controls="recipe-card-container"
              class="px-6 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-md focus:outline-none"
            >
              🍽️ Food Meal
            </button>
            <button 
              id="tab-cocktail" 
              role="tab" 
              aria-selected="false" 
              aria-controls="recipe-card-container"
              class="px-6 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-slate-700/50 focus:outline-none"
            >
              🍸 Cocktail Drink
            </button>
          </div>
        </div>

        <!-- Surprise Me Action Button -->
        <div class="w-full md:w-auto">
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-400 dark:text-slate-500 mb-2 hidden md:block">
            Generate Random Item
          </label>
          <button 
            id="surprise-btn" 
            aria-label="Surprise Me with a random recipe"
            class="ripple-container w-full md:w-auto px-8 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-95 text-white font-bold text-base shadow-lg shadow-indigo-500/25 transition-all duration-200 flex items-center justify-center focus:outline-none"
          >
            <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
            </svg>
            Surprise Me!
          </button>
        </div>

      </div>
    </div>

    <!-- Dual Column Main Layout (Recipe Display + Sidebar) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Primary Display Area -->
      <section class="lg:col-span-8">
        <div id="recipe-card-container" aria-live="polite" class="min-h-[400px]">
          <!-- Dynamic rendering target for idle, loading, error, and success states -->
        </div>
      </section>

      <!-- Sidebar Area: History & Favorites -->
      <aside class="no-print lg:col-span-4 space-y-6">
        
        <!-- History Drawer Panel -->
        <div id="history-panel" class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-100 dark:border-slate-700/60">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-700/60">
            <h2 class="text-sm font-extrabold uppercase tracking-wider text-slate-900 dark:text-white flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              Recent History
            </h2>
            <span class="text-[11px] font-semibold text-slate-400">Max 5</span>
          </div>

          <div id="history-list" class="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
            <!-- Dynamic history items rendered here -->
          </div>
        </div>

        <!-- Favorites Panel -->
        <div id="favorites-panel" class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-100 dark:border-slate-700/60">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-700/60">
            <h2 class="text-sm font-extrabold uppercase tracking-wider text-slate-900 dark:text-white flex items-center gap-2">
              <svg class="w-4 h-4 text-red-500 fill-red-500" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.684a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
              </svg>
              Saved Favorites
            </h2>
          </div>

          <div id="favorites-list" class="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
            <!-- Dynamic favorite items rendered here -->
          </div>
        </div>

      </aside>

    </div>

  </main>

  <!-- Global Toast Notification Region -->
  <div id="toast-container" class="no-print" aria-live="polite" aria-atomic="true"></div>

  <!-- Footer -->
  <footer class="no-print border-t border-slate-200/60 dark:border-slate-800 mt-12 py-6 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-600 dark:text-slate-400">
      <p>Feast & Sip &bull; Production Random Recipe & Cocktail Generator &bull; Powered by TheMealDB & TheCocktailDB</p>
    </div>
  </footer>

  <!-- Modular Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
